<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浴室 | FORT DESIGN STANDARD</title>
<meta name="description" content="FORTの施工事例からご覧いただく、浴室の標準仕様と考え方。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html">FORT</a>
  </div>
</header>

<main>

  <!-- ===================== Hero ===================== -->
  <section>
    <div class="container hero__inner">
      <p class="hero__eyebrow">BATHROOM</p>
      <h1 class="hero__heading">くつろぎに、妥協はいらない。</h1>
    </div>
    <div class="hero__photo">
      <!-- IMAGE: 浴室全体カット。推奨 2400x1500px -->
      <img src="https://placehold.co/2400x1500/e9e3d4/93805f?text=Bathroom" alt="浴室の施工写真:全体カット">
    </div>
  </section>

  <!-- ===================== FORTが選ぶ理由 ===================== -->
  <section class="point-list">
    <div class="container">
      <h2 class="section-heading">FORTが選ぶ理由</h2>
      <p class="point-list__lead">くつろぎと安全、両方を基準に選んでいます。</p>
      <div class="point-list__grid">
        <div class="point-list__item">
          <span>断熱・保温</span>
          <span class="point-list__note">急な温度差から、家族を守る</span>
        </div>
        <div class="point-list__item">
          <span>お手入れのしやすさ</span>
          <span class="point-list__note">カビや汚れに強く</span>
        </div>
        <div class="point-list__item">
          <span>くつろぎ</span>
          <span class="point-list__note">一日の疲れを癒す設え</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 標準仕様 ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">標準仕様</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 浴槽。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Tub" alt="標準仕様:浴槽">
          </div>
          <p class="photo-grid__label">浴槽</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 断熱・保温。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Insulation" alt="標準仕様:断熱・保温">
          </div>
          <p class="photo-grid__label">断熱・保温</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 換気乾燥暖房。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Ventilation" alt="標準仕様:換気乾燥暖房">
          </div>
          <p class="photo-grid__label">換気乾燥暖房</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 床材。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Floor" alt="標準仕様:床材">
          </div>
          <p class="photo-grid__label">床材</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== 施工事例 ===================== -->
  <section class="showcase">
    <div class="container">
      <h2 class="section-heading">施工事例</h2>
    </div>
    <div class="showcase__stack">
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 浴室全体。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e9e3d4/93805f?text=Bathroom" alt="施工事例:浴室全体">
        </div>
        <figcaption class="showcase__caption"><div class="container">浴室全体</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 断熱・保温仕様のディテール。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e3ddcd/93805f?text=Detail" alt="施工事例:断熱・保温仕様のディテール">
        </div>
        <figcaption class="showcase__caption"><div class="container">断熱・保温仕様のディテール</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 換気システム。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e9e3d4/93805f?text=Ventilation" alt="施工事例:換気システム">
        </div>
        <figcaption class="showcase__caption"><div class="container">換気システム</div></figcaption>
      </figure>
    </div>
  </section>

  <!-- ===================== おすすめの組み合わせ ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">おすすめの組み合わせ</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: グレー系パネル × ウッド調カウンター。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+A" alt="組み合わせ:グレー系パネル × ウッド調カウンター">
          </div>
          <p class="photo-grid__label">グレー系パネル × ウッド調カウンター</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: ホワイト × ブラックアクセント。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e3ddcd/93805f?text=Combo+B" alt="組み合わせ:ホワイト × ブラックアクセント">
          </div>
          <p class="photo-grid__label">ホワイト × ブラックアクセント</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: タイル調 × 上質な照明。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+C" alt="組み合わせ:タイル調 × 上質な照明">
          </div>
          <p class="photo-grid__label">タイル調 × 上質な照明</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== CTA ===================== -->
  <section class="cta">
    <div class="container">
      <h2 class="cta__heading">気になる浴室は、見つかりましたか。</h2>
      <div class="cta__button">
        <a class="btn-primary" href="contact.html">この浴室で相談する</a>
      </div>
    </div>
  </section>

</main>

</body>
</html>
