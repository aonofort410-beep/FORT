<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外装 | FORT DESIGN STANDARD</title>
<meta name="description" content="FORTの施工事例からご覧いただく、外装まわりの標準仕様と考え方。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html">FORT</a>
  </div>
</header>

<main>

  <!-- ===================== Hero ===================== -->
  <section>
    <div class="container hero__inner">
      <p class="hero__eyebrow">EXTERIOR</p>
      <h1 class="hero__heading">十年後も、美しくあるために。</h1>
    </div>
    <div class="hero__photo">
      <!-- IMAGE: 外観全景。推奨 2400x1500px -->
      <img src="https://placehold.co/2400x1500/e9e3d4/93805f?text=Exterior" alt="外装の施工写真:外観全景">
    </div>
  </section>

  <!-- ===================== FORTが選ぶ理由 ===================== -->
  <section class="point-list">
    <div class="container">
      <h2 class="section-heading">FORTが選ぶ理由</h2>
      <p class="point-list__lead">意匠と耐候性、両方を妥協しないための外装仕様です。</p>
      <div class="point-list__grid">
        <div class="point-list__item">
          <span>意匠の一貫性</span>
          <span class="point-list__note">街並みに馴染む佇まいを保つ</span>
        </div>
        <div class="point-list__item">
          <span>耐候性</span>
          <span class="point-list__note">風雨に強く、経年でも美しく</span>
        </div>
        <div class="point-list__item">
          <span>メンテナンス性</span>
          <span class="point-list__note">長く付き合える手間で</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 標準仕様 ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">標準仕様</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 外壁材。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Wall" alt="標準仕様:外壁材">
          </div>
          <p class="photo-grid__label">外壁材</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 屋根材。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Roof" alt="標準仕様:屋根材">
          </div>
          <p class="photo-grid__label">屋根材</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 軒天・破風。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Eaves" alt="標準仕様:軒天・破風">
          </div>
          <p class="photo-grid__label">軒天・破風</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: サッシ・玄関ドア。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Sash" alt="標準仕様:サッシ・玄関ドア">
          </div>
          <p class="photo-grid__label">サッシ・玄関ドア</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== 施工事例 ===================== -->
  <section class="showcase">
    <div class="container">
      <h2 class="section-heading">施工事例</h2>
    </div>
    <div class="showcase__stack">
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 外観。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e9e3d4/93805f?text=Exterior" alt="施工事例:外観">
        </div>
        <figcaption class="showcase__caption"><div class="container">外観</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 夕景。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e3ddcd/93805f?text=Evening" alt="施工事例:夕景">
        </div>
        <figcaption class="showcase__caption"><div class="container">夕景</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 素材のディテール。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e9e3d4/93805f?text=Detail" alt="施工事例:素材のディテール">
        </div>
        <figcaption class="showcase__caption"><div class="container">素材のディテール</div></figcaption>
      </figure>
    </div>
  </section>

  <!-- ===================== おすすめの組み合わせ ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">おすすめの組み合わせ</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: ダークグレー外壁 × 木目調ドア。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+A" alt="組み合わせ:ダークグレー外壁 × 木目調ドア">
          </div>
          <p class="photo-grid__label">ダークグレー外壁 × 木目調ドア</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: 白い塗り壁 × 黒サッシ。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e3ddcd/93805f?text=Combo+B" alt="組み合わせ:白い塗り壁 × 黒サッシ">
          </div>
          <p class="photo-grid__label">白い塗り壁 × 黒サッシ</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: ガルバリウム × 石調アクセント。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+C" alt="組み合わせ:ガルバリウム × 石調アクセント">
          </div>
          <p class="photo-grid__label">ガルバリウム × 石調アクセント</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== CTA ===================== -->
  <section class="cta">
    <div class="container">
      <h2 class="cta__heading">気になる外観は、見つかりましたか。</h2>
      <div class="cta__button">
        <a class="btn-primary" href="contact.html">この外観で相談する</a>
      </div>
    </div>
  </section>

</main>

</body>
</html>
