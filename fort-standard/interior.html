<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内装 | FORT DESIGN STANDARD</title>
<meta name="description" content="FORTの施工事例からご覧いただく、内装まわりの標準仕様と考え方。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html">FORT</a>
  </div>
</header>

<main>

  <!-- ===================== Hero ===================== -->
  <section>
    <div class="container hero__inner">
      <p class="hero__eyebrow">INTERIOR</p>
      <h1 class="hero__heading">触れるたびに、上質を感じる。</h1>
    </div>
    <div class="hero__photo">
      <!-- IMAGE: リビング全体。推奨 2400x1500px -->
      <img src="https://placehold.co/2400x1500/e9e3d4/93805f?text=Interior" alt="内装の施工写真:リビング全体">
    </div>
  </section>

  <!-- ===================== FORTが選ぶ理由 ===================== -->
  <section class="point-list">
    <div class="container">
      <h2 class="section-heading">FORTが選ぶ理由</h2>
      <p class="point-list__lead">毎日手が触れる場所だからこそ、素材から選んでいます。</p>
      <div class="point-list__grid">
        <div class="point-list__item">
          <span>素材の質感</span>
          <span class="point-list__note">手に触れて分かる違いを</span>
        </div>
        <div class="point-list__item">
          <span>経年美</span>
          <span class="point-list__note">使うほどに馴染む表情</span>
        </div>
        <div class="point-list__item">
          <span>掃除・耐久性</span>
          <span class="point-list__note">日々の暮らしに耐える丈夫さ</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 標準仕様 ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">標準仕様</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 床材。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Floor" alt="標準仕様:床材">
          </div>
          <p class="photo-grid__label">床材</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 建具。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Door" alt="標準仕様:建具">
          </div>
          <p class="photo-grid__label">建具</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 造作家具。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Furniture" alt="標準仕様:造作家具">
          </div>
          <p class="photo-grid__label">造作家具</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 壁装仕上げ。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Wall" alt="標準仕様:壁装仕上げ">
          </div>
          <p class="photo-grid__label">壁装仕上げ</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== 施工事例 ===================== -->
  <section class="showcase">
    <div class="container">
      <h2 class="section-heading">施工事例</h2>
    </div>
    <div class="showcase__stack">
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: リビング。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e9e3d4/93805f?text=Living" alt="施工事例:リビング">
        </div>
        <figcaption class="showcase__caption"><div class="container">リビング</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 床材のディテール。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e3ddcd/93805f?text=Floor+Detail" alt="施工事例:床材のディテール">
        </div>
        <figcaption class="showcase__caption"><div class="container">床材のディテール</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 造作家具。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e9e3d4/93805f?text=Furniture" alt="施工事例:造作家具">
        </div>
        <figcaption class="showcase__caption"><div class="container">造作家具</div></figcaption>
      </figure>
    </div>
  </section>

  <!-- ===================== おすすめの組み合わせ ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">おすすめの組み合わせ</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: 無垢床 × 白い壁。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+A" alt="組み合わせ:無垢床 × 白い壁">
          </div>
          <p class="photo-grid__label">無垢床 × 白い壁</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: モルタル調 × ブラック建具。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e3ddcd/93805f?text=Combo+B" alt="組み合わせ:モルタル調 × ブラック建具">
          </div>
          <p class="photo-grid__label">モルタル調 × ブラック建具</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: タイル × 木製造作。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+C" alt="組み合わせ:タイル × 木製造作">
          </div>
          <p class="photo-grid__label">タイル × 木製造作</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== CTA ===================== -->
  <section class="cta">
    <div class="container">
      <h2 class="cta__heading">気になる内装は、見つかりましたか。</h2>
      <div class="cta__button">
        <a class="btn-primary" href="contact.html">この内装で相談する</a>
      </div>
    </div>
  </section>

</main>

</body>
</html>
