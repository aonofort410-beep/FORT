<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キッチン | FORT DESIGN STANDARD</title>
<meta name="description" content="FORTの施工事例からご覧いただく、キッチンの標準仕様と考え方。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html">FORT</a>
  </div>
</header>

<main>

  <!-- ===================== Hero ===================== -->
  <section>
    <div class="container hero__inner">
      <p class="hero__eyebrow">KITCHEN</p>
      <h1 class="hero__heading">使いやすさは、選び抜いた結果。</h1>
    </div>
    <div class="hero__photo">
      <!-- IMAGE: キッチン全体カット。推奨 2400x1500px -->
      <img src="https://placehold.co/2400x1500/e9e3d4/93805f?text=Kitchen" alt="キッチンの施工写真:全体カット">
    </div>
  </section>

  <!-- ===================== FORTが選ぶ理由 ===================== -->
  <section class="point-list">
    <div class="container">
      <h2 class="section-heading">FORTが選ぶ理由</h2>
      <p class="point-list__lead">家事動線と美しさを、同時に叶えるために選んでいます。</p>
      <div class="point-list__grid">
        <div class="point-list__item">
          <span>家事動線</span>
          <span class="point-list__note">無理のない配置と高さ</span>
        </div>
        <div class="point-list__item">
          <span>耐久性</span>
          <span class="point-list__note">水にも熱にも、強くあるように</span>
        </div>
        <div class="point-list__item">
          <span>デザイン性</span>
          <span class="point-list__note">LDK全体との調和</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 標準仕様 ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">標準仕様</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: キッチン本体。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Body" alt="標準仕様:キッチン本体">
          </div>
          <p class="photo-grid__label">キッチン本体</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 天板。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Counter" alt="標準仕様:天板">
          </div>
          <p class="photo-grid__label">天板</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 収納。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Storage" alt="標準仕様:収納">
          </div>
          <p class="photo-grid__label">収納</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 水栓。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Faucet" alt="標準仕様:水栓">
          </div>
          <p class="photo-grid__label">水栓</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: レンジフード。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Hood" alt="標準仕様:レンジフード">
          </div>
          <p class="photo-grid__label">レンジフード</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== 施工事例 ===================== -->
  <section class="showcase">
    <div class="container">
      <h2 class="section-heading">施工事例</h2>
    </div>
    <div class="showcase__stack">
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: キッチン全体。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e9e3d4/93805f?text=Kitchen" alt="施工事例:キッチン全体">
        </div>
        <figcaption class="showcase__caption"><div class="container">キッチン全体</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 天板・水栓のディテール。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e3ddcd/93805f?text=Detail" alt="施工事例:天板・水栓のディテール">
        </div>
        <figcaption class="showcase__caption"><div class="container">天板・水栓のディテール</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 収納内部。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e9e3d4/93805f?text=Storage" alt="施工事例:収納内部">
        </div>
        <figcaption class="showcase__caption"><div class="container">収納内部</div></figcaption>
      </figure>
    </div>
  </section>

  <!-- ===================== おすすめの組み合わせ ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">おすすめの組み合わせ</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: ステンレス天板 × ブラック取っ手。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+A" alt="組み合わせ:ステンレス天板 × ブラック取っ手">
          </div>
          <p class="photo-grid__label">ステンレス天板 × ブラック取っ手</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: 人造大理石 × ウッド収納。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e3ddcd/93805f?text=Combo+B" alt="組み合わせ:人造大理石 × ウッド収納">
          </div>
          <p class="photo-grid__label">人造大理石 × ウッド収納</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: タイル壁 × 真鍮水栓。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+C" alt="組み合わせ:タイル壁 × 真鍮水栓">
          </div>
          <p class="photo-grid__label">タイル壁 × 真鍮水栓</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== CTA ===================== -->
  <section class="cta">
    <div class="container">
      <h2 class="cta__heading">気になるキッチンは、見つかりましたか。</h2>
      <div class="cta__button">
        <a class="btn-primary" href="contact.html">このキッチンで相談する</a>
      </div>
    </div>
  </section>

</main>

</body>
</html>
