<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>照明 | FORT DESIGN STANDARD</title>
<meta name="description" content="FORTの施工事例からご覧いただく、照明の標準仕様と考え方。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html">FORT</a>
  </div>
</header>

<main>

  <!-- ===================== Hero ===================== -->
  <section>
    <div class="container hero__inner">
      <p class="hero__eyebrow">LIGHTING</p>
      <h1 class="hero__heading">灯りひとつで、暮らしが変わる。</h1>
    </div>
    <div class="hero__photo">
      <!-- IMAGE: 夜の室内カット。推奨 2400x1500px -->
      <img src="https://placehold.co/2400x1500/16130f/93805f?text=Lighting" alt="照明の施工写真:夜の室内カット">
    </div>
  </section>

  <!-- ===================== FORTが選ぶ理由 ===================== -->
  <section class="point-list">
    <div class="container">
      <h2 class="section-heading">FORTが選ぶ理由</h2>
      <p class="point-list__lead">明るさだけでなく、時間帯ごとの心地よさを設計します。</p>
      <div class="point-list__grid">
        <div class="point-list__item">
          <span>機能性</span>
          <span class="point-list__note">必要な明るさを確保</span>
        </div>
        <div class="point-list__item">
          <span>情緒性</span>
          <span class="point-list__note">時間帯ごとの心地よさ</span>
        </div>
        <div class="point-list__item">
          <span>省エネ性</span>
          <span class="point-list__note">毎日のことだから、電気代にもやさしく</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 標準仕様 ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">標準仕様</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: ダウンライト計画。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Downlight" alt="標準仕様:ダウンライト計画">
          </div>
          <p class="photo-grid__label">ダウンライト計画</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: LED仕様。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=LED" alt="標準仕様:LED仕様">
          </div>
          <p class="photo-grid__label">LED仕様</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 調光・シーン照明。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Dimming" alt="標準仕様:調光・シーン照明">
          </div>
          <p class="photo-grid__label">調光・シーン照明</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== 施工事例 ===================== -->
  <section class="showcase">
    <div class="container">
      <h2 class="section-heading">施工事例</h2>
    </div>
    <div class="showcase__stack">
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 夜のリビング。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/16130f/93805f?text=Evening" alt="施工事例:夜のリビング">
        </div>
        <figcaption class="showcase__caption"><div class="container">夜のリビング</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 間接照明のディテール。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/1f1a15/93805f?text=Detail" alt="施工事例:間接照明のディテール">
        </div>
        <figcaption class="showcase__caption"><div class="container">間接照明のディテール</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 各部屋の照明配置。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/16130f/93805f?text=Rooms" alt="施工事例:各部屋の照明配置">
        </div>
        <figcaption class="showcase__caption"><div class="container">各部屋の照明配置</div></figcaption>
      </figure>
    </div>
  </section>

  <!-- ===================== おすすめの組み合わせ ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">おすすめの組み合わせ</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: ダウンライト × 間接照明。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+A" alt="組み合わせ:ダウンライト × 間接照明">
          </div>
          <p class="photo-grid__label">ダウンライト × 間接照明</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: ペンダント × ダウンライト。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e3ddcd/93805f?text=Combo+B" alt="組み合わせ:ペンダント × ダウンライト">
          </div>
          <p class="photo-grid__label">ペンダント × ダウンライト</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: スポットライト × 調光。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+C" alt="組み合わせ:スポットライト × 調光">
          </div>
          <p class="photo-grid__label">スポットライト × 調光</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== CTA ===================== -->
  <section class="cta">
    <div class="container">
      <h2 class="cta__heading">気になる灯りは、見つかりましたか。</h2>
      <div class="cta__button">
        <a class="btn-primary" href="contact.html">この照明プランで相談する</a>
      </div>
    </div>
  </section>

</main>

</body>
</html>
