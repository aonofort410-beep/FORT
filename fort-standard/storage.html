<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>収納 | FORT DESIGN STANDARD</title>
<meta name="description" content="FORTの施工事例からご覧いただく、収納の標準仕様と考え方。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html">FORT</a>
  </div>
</header>

<main>

  <!-- ===================== Hero ===================== -->
  <section>
    <div class="container hero__inner">
      <p class="hero__eyebrow">STORAGE</p>
      <h1 class="hero__heading">片づいた暮らしは、設計から生まれる。</h1>
    </div>
    <div class="hero__photo">
      <!-- IMAGE: 収納空間全体。推奨 2400x1500px -->
      <img src="https://placehold.co/2400x1500/e9e3d4/93805f?text=Storage" alt="収納の施工写真:空間全体">
    </div>
  </section>

  <!-- ===================== FORTが選ぶ理由 ===================== -->
  <section class="point-list">
    <div class="container">
      <h2 class="section-heading">FORTが選ぶ理由</h2>
      <p class="point-list__lead">量より配置。暮らしの動線から逆算しています。</p>
      <div class="point-list__grid">
        <div class="point-list__item">
          <span>動線設計</span>
          <span class="point-list__note">使う場所の近くに配置</span>
        </div>
        <div class="point-list__item">
          <span>可変性</span>
          <span class="point-list__note">暮らしの変化に対応できる</span>
        </div>
        <div class="point-list__item">
          <span>適正量</span>
          <span class="point-list__note">多すぎず、少なすぎず</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 標準仕様 ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">標準仕様</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: クローゼット。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Closet" alt="標準仕様:クローゼット">
          </div>
          <p class="photo-grid__label">クローゼット</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: シューズクローク。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Shoes" alt="標準仕様:シューズクローク">
          </div>
          <p class="photo-grid__label">シューズクローク</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: パントリー。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Pantry" alt="標準仕様:パントリー">
          </div>
          <p class="photo-grid__label">パントリー</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 可変棚。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Shelf" alt="標準仕様:可変棚">
          </div>
          <p class="photo-grid__label">可変棚</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== 施工事例 ===================== -->
  <section class="showcase">
    <div class="container">
      <h2 class="section-heading">施工事例</h2>
    </div>
    <div class="showcase__stack">
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 収納全体。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e9e3d4/93805f?text=Storage" alt="施工事例:収納全体">
        </div>
        <figcaption class="showcase__caption"><div class="container">収納全体</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 収納内部の使い方。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e3ddcd/93805f?text=Detail" alt="施工事例:収納内部の使い方">
        </div>
        <figcaption class="showcase__caption"><div class="container">収納内部の使い方</div></figcaption>
      </figure>
    </div>
  </section>

  <!-- ===================== おすすめの組み合わせ ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">おすすめの組み合わせ</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: 土間収納 × 可動棚。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+A" alt="組み合わせ:土間収納 × 可動棚">
          </div>
          <p class="photo-grid__label">土間収納 × 可動棚</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: パントリー × オープン棚。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e3ddcd/93805f?text=Combo+B" alt="組み合わせ:パントリー × オープン棚">
          </div>
          <p class="photo-grid__label">パントリー × オープン棚</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: ウォークインクローゼット × 可変レール。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+C" alt="組み合わせ:ウォークインクローゼット × 可変レール">
          </div>
          <p class="photo-grid__label">ウォークインクローゼット × 可変レール</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== CTA ===================== -->
  <section class="cta">
    <div class="container">
      <h2 class="cta__heading">気になる収納は、見つかりましたか。</h2>
      <div class="cta__button">
        <a class="btn-primary" href="contact.html">この収納プランで相談する</a>
      </div>
    </div>
  </section>

</main>

</body>
</html>
