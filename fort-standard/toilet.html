<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トイレ | FORT DESIGN STANDARD</title>
<meta name="description" content="FORTの施工事例からご覧いただく、トイレの標準仕様と考え方。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html">FORT</a>
  </div>
</header>

<main>

  <!-- ===================== Hero ===================== -->
  <section>
    <div class="container hero__inner">
      <p class="hero__eyebrow">TOILET</p>
      <h1 class="hero__heading">見えない配慮こそ、標準に。</h1>
    </div>
    <div class="hero__photo">
      <!-- IMAGE: トイレ空間全体。推奨 2400x1500px -->
      <img src="https://placehold.co/2400x1500/e9e3d4/93805f?text=Toilet" alt="トイレの施工写真:空間全体">
    </div>
  </section>

  <!-- ===================== FORTが選ぶ理由 ===================== -->
  <section class="point-list">
    <div class="container">
      <h2 class="section-heading">FORTが選ぶ理由</h2>
      <p class="point-list__lead">清潔さも快適さも、標準であるべきだと考えています。</p>
      <div class="point-list__grid">
        <div class="point-list__item">
          <span>清潔性</span>
          <span class="point-list__note">汚れに強い素材と形状</span>
        </div>
        <div class="point-list__item">
          <span>節水性能</span>
          <span class="point-list__note">環境にもコストにも配慮</span>
        </div>
        <div class="point-list__item">
          <span>快適性</span>
          <span class="point-list__note">座る瞬間から、心地よく</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 標準仕様 ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">標準仕様</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 便器。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Toilet" alt="標準仕様:便器">
          </div>
          <p class="photo-grid__label">便器</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 収納・手洗い。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Storage" alt="標準仕様:収納・手洗い">
          </div>
          <p class="photo-grid__label">収納・手洗い</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 内装仕上げ。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Finish" alt="標準仕様:内装仕上げ">
          </div>
          <p class="photo-grid__label">内装仕上げ</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== 施工事例 ===================== -->
  <section class="showcase">
    <div class="container">
      <h2 class="section-heading">施工事例</h2>
    </div>
    <div class="showcase__stack">
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: トイレ空間。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e9e3d4/93805f?text=Toilet" alt="施工事例:トイレ空間">
        </div>
        <figcaption class="showcase__caption"><div class="container">トイレ空間</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 便器のディテール。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e3ddcd/93805f?text=Detail" alt="施工事例:便器のディテール">
        </div>
        <figcaption class="showcase__caption"><div class="container">便器のディテール</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 収納・手洗いカウンター。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e9e3d4/93805f?text=Counter" alt="施工事例:収納・手洗いカウンター">
        </div>
        <figcaption class="showcase__caption"><div class="container">収納・手洗いカウンター</div></figcaption>
      </figure>
    </div>
  </section>

  <!-- ===================== おすすめの組み合わせ ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">おすすめの組み合わせ</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: モノトーン × 真鍮アクセント。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+A" alt="組み合わせ:モノトーン × 真鍮アクセント">
          </div>
          <p class="photo-grid__label">モノトーン × 真鍮アクセント</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: ナチュラル × グリーン。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e3ddcd/93805f?text=Combo+B" alt="組み合わせ:ナチュラル × グリーン">
          </div>
          <p class="photo-grid__label">ナチュラル × グリーン</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: アクセントクロス × タイル床。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+C" alt="組み合わせ:アクセントクロス × タイル床">
          </div>
          <p class="photo-grid__label">アクセントクロス × タイル床</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== CTA ===================== -->
  <section class="cta">
    <div class="container">
      <h2 class="cta__heading">気になるトイレは、見つかりましたか。</h2>
      <div class="cta__button">
        <a class="btn-primary" href="contact.html">このトイレで相談する</a>
      </div>
    </div>
  </section>

</main>

</body>
</html>
