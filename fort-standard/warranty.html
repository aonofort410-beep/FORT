<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保証 | FORT DESIGN STANDARD</title>
<meta name="description" content="FORTの施工事例からご覧いただく、保証・アフターサービスの考え方。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html">FORT</a>
  </div>
</header>

<main>

  <!-- ===================== Hero ===================== -->
  <section>
    <div class="container hero__inner">
      <p class="hero__eyebrow">WARRANTY</p>
      <h1 class="hero__heading">選んだ基準を、守りつづける約束。</h1>
    </div>
    <div class="hero__photo">
      <!-- IMAGE: 引き渡し時の説明シーン。推奨 2400x1500px -->
      <img src="https://placehold.co/2400x1500/e9e3d4/93805f?text=Warranty" alt="保証:引き渡し時の説明シーン">
    </div>
  </section>

  <!-- ===================== FORTが選ぶ理由 ===================== -->
  <section class="point-list">
    <div class="container">
      <h2 class="section-heading">FORTが選ぶ理由</h2>
      <p class="point-list__lead">引き渡した後も、同じ基準で支え続けるために。</p>
      <div class="point-list__grid">
        <div class="point-list__item">
          <span>構造の保証</span>
          <span class="point-list__note">長期にわたる安心</span>
        </div>
        <div class="point-list__item">
          <span>定期点検</span>
          <span class="point-list__note">変化を早期に見つける</span>
        </div>
        <div class="point-list__item">
          <span>アフター対応</span>
          <span class="point-list__note">困った時にすぐ頼れる</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 標準仕様 ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">標準仕様</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 構造保証。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Structure" alt="標準仕様:構造保証">
          </div>
          <p class="photo-grid__label">構造保証</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 設備保証。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Equipment" alt="標準仕様:設備保証">
          </div>
          <p class="photo-grid__label">設備保証</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 定期点検。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Inspection" alt="標準仕様:定期点検">
          </div>
          <p class="photo-grid__label">定期点検</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: アフター対応。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Support" alt="標準仕様:アフター対応">
          </div>
          <p class="photo-grid__label">アフター対応</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== 施工事例 ===================== -->
  <section class="showcase">
    <div class="container">
      <h2 class="section-heading">施工事例</h2>
    </div>
    <div class="showcase__stack">
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: 定期点検の様子。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e9e3d4/93805f?text=Inspection" alt="施工事例:定期点検の様子">
        </div>
        <figcaption class="showcase__caption"><div class="container">定期点検の様子</div></figcaption>
      </figure>
      <figure>
        <div class="showcase__photo">
          <!-- IMAGE: アフターサービススタッフの対応。推奨 1920x1200px -->
          <img src="https://placehold.co/1920x1200/e3ddcd/93805f?text=Support" alt="施工事例:アフターサービススタッフの対応">
        </div>
        <figcaption class="showcase__caption"><div class="container">アフターサービススタッフの対応</div></figcaption>
      </figure>
    </div>
  </section>

  <!-- ===================== おすすめの組み合わせ ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">おすすめの組み合わせ</h2>
      <div class="photo-grid">
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: 構造保証20年 × 5年ごとの定期点検。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+A" alt="組み合わせ:構造保証20年 × 5年ごとの定期点検">
          </div>
          <p class="photo-grid__label">構造保証20年 × 5年ごとの定期点検</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: 設備保証10年 × 24時間サポート窓口。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e3ddcd/93805f?text=Combo+B" alt="組み合わせ:設備保証10年 × 24時間サポート窓口">
          </div>
          <p class="photo-grid__label">設備保証10年 × 24時間サポート窓口</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: 引き渡し時説明 × 初年度点検。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Combo+C" alt="組み合わせ:引き渡し時説明 × 初年度点検">
          </div>
          <p class="photo-grid__label">引き渡し時説明 × 初年度点検</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== CTA ===================== -->
  <section class="cta">
    <div class="container">
      <h2 class="cta__heading">保証について、詳しく知りたくなりましたか。</h2>
      <div class="cta__button">
        <a class="btn-primary" href="contact.html">保証について相談する</a>
      </div>
    </div>
  </section>

</main>

</body>
</html>
