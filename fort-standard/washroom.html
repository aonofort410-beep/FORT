<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洗面 | FORT DESIGN STANDARD</title>
<meta name="description" content="FORTの施工事例からご覧いただく、洗面まわりのスタイルとコーディネートの考え方。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html">FORT</a>
  </div>
</header>

<main>

  <!-- ===================== Hero ===================== -->
  <section>
    <div class="container hero__inner">
      <p class="hero__eyebrow">WASHROOM</p>
      <h1 class="hero__heading">毎日使う場所だから、美しさと使いやすさを。</h1>
    </div>
    <div class="hero__photo">
      <!-- IMAGE: 洗面の大きな空間カット。推奨 2400x1500px -->
      <img src="https://placehold.co/2400x1500/e9e3d4/93805f?text=Washroom" alt="洗面の施工写真:大きな空間カット">
    </div>
  </section>

  <!-- ===================== Concept ===================== -->
  <section class="statement">
    <div class="container">
      <p class="statement__text">洗面は、ただ手を洗う場所ではなく、暮らしの印象を整える場所。</p>
    </div>
  </section>

  <!-- ===================== Style Gallery ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">スタイルから選ぶ</h2>
      <div class="photo-grid photo-grid--wide-desktop">
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: ホテルライクな洗面。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Hotel-like" alt="スタイル:ホテルライク">
          </div>
          <p class="photo-grid__label">ホテルライク</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: ナチュラルな洗面。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e3ddcd/93805f?text=Natural" alt="スタイル:ナチュラル">
          </div>
          <p class="photo-grid__label">ナチュラル</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: グレージュの洗面。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Greige" alt="スタイル:グレージュ">
          </div>
          <p class="photo-grid__label">グレージュ</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: ブラックの洗面。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e3ddcd/93805f?text=Black" alt="スタイル:ブラック">
          </div>
          <p class="photo-grid__label">ブラック</p>
        </figure>
        <figure>
          <div class="photo-grid__photo">
            <!-- IMAGE: ジャパンディの洗面。推奨 800x1000px -->
            <img src="https://placehold.co/800x1000/e9e3d4/93805f?text=Japandi" alt="スタイル:ジャパンディ">
          </div>
          <p class="photo-grid__label">ジャパンディ</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== Case Detail ===================== -->
  <section class="photo-grid-section">
    <div class="container">
      <h2 class="section-heading">施工事例</h2>
    </div>
    <div class="case-detail__overview">
      <!-- IMAGE: 施工事例の洗面全体。推奨 2100x900px -->
      <img src="https://placehold.co/2100x900/e9e3d4/93805f?text=Case" alt="施工事例:洗面全体">
    </div>
    <div class="container">
      <p class="case-detail__label">採用したもの</p>
      <div class="photo-grid" style="grid-template-columns:repeat(2,1fr);margin-top:24px;">
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: カウンター。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Counter" alt="採用品:カウンター">
          </div>
          <p class="photo-grid__label">カウンター</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: ボウル。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Bowl" alt="採用品:ボウル">
          </div>
          <p class="photo-grid__label">ボウル</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: ミラー。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Mirror" alt="採用品:ミラー">
          </div>
          <p class="photo-grid__label">ミラー</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 照明。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Light" alt="採用品:照明">
          </div>
          <p class="photo-grid__label">照明</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: 収納。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e9e3d4/93805f?text=Storage" alt="採用品:収納">
          </div>
          <p class="photo-grid__label">収納</p>
        </figure>
        <figure>
          <div class="photo-grid__photo photo-grid__photo--square">
            <!-- IMAGE: クロス・タイル。推奨 800x800px -->
            <img src="https://placehold.co/800x800/e3ddcd/93805f?text=Wall" alt="採用品:クロス・タイル">
          </div>
          <p class="photo-grid__label">クロス・タイル</p>
        </figure>
      </div>
    </div>
  </section>

  <!-- ===================== Coordinate Point ===================== -->
  <section class="point-list">
    <div class="container">
      <h2 class="section-heading">コーディネートのポイント</h2>
      <div class="point-list__grid">
        <div class="point-list__item">
          <span>色合わせ</span>
          <span class="point-list__note">床・壁・建具の色温度を揃える</span>
        </div>
        <div class="point-list__item">
          <span>素材感</span>
          <span class="point-list__note">光の当たり方で質感を選ぶ</span>
        </div>
        <div class="point-list__item">
          <span>掃除のしやすさ</span>
          <span class="point-list__note">凹凸の少ない形状を選ぶ</span>
        </div>
        <div class="point-list__item">
          <span>収納量</span>
          <span class="point-list__note">使う人数と持ち物量から逆算する</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== CTA ===================== -->
  <section class="cta">
    <div class="container">
      <h2 class="cta__heading">気になる雰囲気は、見つかりましたか。</h2>
      <div class="cta__button">
        <a class="btn-primary" href="contact.html">この雰囲気で相談する</a>
      </div>
    </div>
  </section>

</main>

</body>
</html>
